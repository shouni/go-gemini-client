# CI の実体は shouni/workflows。ジョブ構成とタグ運用の理由はそちらの README にある。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      coverage: true
      # CleanJSONResponse は構造化出力の全経路が通るため、探索を毎回回す。
      fuzz-targets: "./gemini#FuzzCleanJSONResponse"
      fuzz-time: 60s
